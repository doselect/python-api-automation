[project]
name = "python-api-automation"
version = "0.1.0"
description = "Pytest/RestAssured-style layered-framework port of doselect/do-api-automation."
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.4",
    "requests>=2.31",
    "jsonschema>=4.20",
    "allure-pytest>=2.13",
    "pytest-html>=4.1",
    # do-api-automation port (see DO_API_PORT_STATUS.md) — matches that repo's requirements.txt.
    "pytest-xdist>=3.3",
    "pytest-ordering>=0.6",
    "bs4>=0.0.2",
    "Faker>=37.1",
]

[tool.pytest.ini_options]
# Adds the project root to sys.path so tests can `from src...` and `from tests...` import.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
# Markers copied from do-api-automation's pytest.ini (see DO_API_PORT_STATUS.md).
markers = [
    "hacker",
    "smoke",
    "regression",
    "public",
    "naukri_campus",
    "issue",
    "testing",
    "depends",
    "dependency",
    "add_criteria",
    "add_participant_data_settings",
    "add_problem",
    "add_problem_during_interview",
    "add_problem_section",
    "add_proctor_settings",
    "add_theme_section",
    "add_three_section_theme_prize_and_eligibility_criteria_section",
